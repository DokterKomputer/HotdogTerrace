<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir UMKM - POS Sederhana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .touch-btn { touch-action: manipulation; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SISI KIRI: KATALOG MENU -->
    <div class="w-full md:w-3/5 h-1/2 md:h-full p-4 flex flex-col border-b md:border-b-0 md:border-r border-gray-300">
        <h1 class="text-2xl font-bold mb-3 text-gray-800">Kasir Warung</h1>
        
        <!-- Filter Kategori -->
        <div class="flex gap-2 mb-4 overflow-x-auto pb-2">
            <button onclick="filterCategory('All')" class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold touch-btn">Semua</button>
            <button onclick="filterCategory('Hotdog')" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold touch-btn">Hotdog</button>
            <button onclick="filterCategory('Burger')" class="bg-yellow-600 text-white px-4 py-2 rounded-lg font-bold touch-btn">Burger</button>
            <button onclick="filterCategory('Drinks')" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold touch-btn">Drinks</button>
        </div>

        <!-- Container Menu (Grid Tombol Besar) -->
        <div id="menuGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto flex-grow p-1">
            <p class="text-gray-500 text-center col-span-full py-10">Memuat data menu...</p>
        </div>
    </div>

    <!-- SISI KANAN: KERANJANG & DETAIL TRANSAKSI -->
    <div class="w-full md:w-2/5 h-1/2 md:h-full p-4 bg-white flex flex-col justify-between">
        <div>
            <h2 class="text-xl font-bold border-b pb-2 mb-3 text-gray-800">Detail Pesanan</h2>
            
            <!-- Input Nama Pelanggan -->
            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Nama Pelanggan:</label>
                <input type="text" id="custName" placeholder="Contoh: Kak Budi" class="w-full border rounded-lg p-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- List Cart -->
            <div id="cartList" class="max-h-48 md:max-h-64 overflow-y-auto space-y-2 mb-3">
                <p class="text-gray-400 text-center py-4">Belum ada item dipilih.</p>
            </div>
        </div>

        <!-- Bagian Pembayaran -->
        <div class="border-t pt-3">
            <div class="flex justify-between text-lg font-bold mb-3">
                <span>Total:</span>
                <span id="totalAmount" class="text-green-600">Rp 0</span>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Metode Bayar:</label>
                <select id="payMethod" class="w-full border rounded-lg p-2 text-base">
                    <option value="Tunai">Tunai</option>
                    <option value="QRIS">QRIS</option>
                </select>
            </div>

            <button onclick="processCheckout()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold text-lg shadow-lg touch-btn">
                PROSES & SIMPAN
            </button>
        </div>
    </div>

    <!-- MODAL STRUK (STRUK PELANGGAN & DAPUR) -->
    <div id="receiptModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-3 text-center">Transaksi Berhasil!</h3>
            
            <!-- Preview Struk Pelanggan -->
            <div class="mb-4">
                <p class="font-semibold text-sm mb-1 text-gray-700">Struk Pelanggan:</p>
                <pre id="customerReceiptText" class="bg-gray-100 p-3 rounded text-xs font-mono whitespace-pre-wrap border"></pre>
            </div>

            <!-- Preview Struk Dapur -->
            <div class="mb-4">
                <p class="font-semibold text-sm mb-1 text-gray-700">Struk Dapur (Kitchen Ticket):</p>
                <pre id="kitchenReceiptText" class="bg-yellow-50 p-3 rounded text-xs font-mono whitespace-pre-wrap border border-yellow-200"></pre>
            </div>

            <button onclick="closeModal()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">Tutup & Pesanan Baru</button>
        </div>
    </div>

    <script>
        // URL Apps Script kamu
        const API_URL = "https://script.google.com/macros/s/AKfycbzVCejzGRj2sHH_akawKhFwliBLJg5PDf37CGRPLncQKiogKgq7ci98D7jtx41Fshgb/exec";

        let allMenu = [];
        let cart = [];

        // Load Menu saat halaman dibuka
        window.onload = function() {
            fetch(API_URL + "?action=getMenu")
                .then(res => res.json())
                .then(data => {
                    allMenu = data;
                    renderMenu(allMenu);
                })
                .catch(err => {
                    document.getElementById('menuGrid').innerHTML = '<p class="text-red-500 text-center col-span-full">Gagal memuat menu!</p>';
                });
        };

        function renderMenu(menuItems) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            menuItems.forEach(item => {
                grid.innerHTML += `
                    <button onclick="addToCart('${item.id}', '${item.nama}', ${item.harga})" class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm hover:shadow-md flex flex-col justify-between items-start text-left touch-btn active:bg-blue-50">
                        <span class="font-bold text-gray-800 text-sm mb-1">${item.nama}</span>
                        <span class="text-xs text-blue-600 font-semibold">Rp ${item.harga.toLocaleString('id-ID')}</span>
                    </button>
                `;
            });
        }

        function filterCategory(cat) {
            if (cat === 'All') {
                renderMenu(allMenu);
            } else {
                const filtered = allMenu.filter(m => m.kategori.toLowerCase() === cat.toLowerCase());
                renderMenu(filtered);
            }
        }

        function addToCart(id, nama, harga) {
            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, nama, harga, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cartList');
            const totalEl = document.getElementById('totalAmount');
            list.innerHTML = '';

            let total = 0;
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-4">Belum ada item dipilih.</p>';
            } else {
                cart.forEach(item => {
                    const subtotal = item.harga * item.qty;
                    total += subtotal;
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg text-sm border">
                            <div class="flex-grow pr-2">
                                <p class="font-bold text-gray-800">${item.nama}</p>
                                <p class="text-xs text-gray-500">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 bg-red-500 text-white rounded font-bold text-sm touch-btn">-</button>
                                <span class="font-bold">${item.qty}</span>
                                <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 bg-green-500 text-white rounded font-bold text-sm touch-btn">+</button>
                            </div>
                        </div>
                    `;
                });
            }
            totalEl.innerText = 'Rp ' + total.toLocaleString('id-ID');
        }

        function processCheckout() {
            if (cart.length === 0) {
                alert("Keranjang masih kosong!");
                return;
            }
            const custName = document.getElementById('custName').value.trim() || 'Pelanggan';
            const payMethod = document.getElementById('payMethod').value;
            const now = new Date();
            const orderNo = "ORD-" + Math.floor(1000 + Math.random() * 9000);
            const dateStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            const timeOnly = now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

            let total = 0;
            let detailTrxList = [];
            let detailKitchenList = [];

            cart.forEach(c => {
                const sub = c.harga * c.qty;
                total += sub;
                detailTrxList.push(`${c.qty}x ${c.nama} (Rp ${sub.toLocaleString('id-ID')})`);
                detailKitchenList.push(`[ ] ${c.qty}x ${c.nama}`);
            });

            const payload = {
                action: "saveTransaction",
                noOrder: orderNo,
                tanggalJam: dateStr,
                jam: timeOnly,
                namaPelanggan: custName,
                rincianPesanan: detailTrxList.join(", "),
                totalBayar: total,
                metode: payMethod,
                daftarPesananDapur: detailKitchenList.join(" | ")
            };

            // Simpan Data ke Google Sheets
            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(res => {
                console.log("Saved:", res);
            }).catch(err => console.error("Error:", err));

            // Buat Teks Struk Pelanggan
            let custReceipt = `==============================\n       WARUNG KASIR\n==============================\nNo. Order : ${orderNo}\nTanggal   : ${dateStr}\nPelanggan : ${custName}\n------------------------------\n`;
            cart.forEach(c => {
                custReceipt += `${c.qty}x ${c.nama.padEnd(18)} Rp ${(c.harga * c.qty).toLocaleString('id-ID')}\n`;
            });
            custReceipt += `------------------------------\nTOTAL     : Rp ${total.toLocaleString('id-ID')}\nMetode    : ${payMethod}\n==============================\n Terima Kasih atas Kunjungan Anda!\n==============================`;

            // Buat Teks Struk Dapur
            let kitchenReceipt = `==============================\n      [ TIKET DAPUR ]\n==============================\nNo. Order : ${orderNo}\nJam       : ${timeOnly}\nPelanggan : ${custName}\n------------------------------\nPESANAN:\n`;
            cart.forEach(c => {
                kitchenReceipt += `[  ] ${c.qty}x ${c.nama}\n`;
            });
            kitchenReceipt += `==============================`;

            document.getElementById('customerReceiptText').innerText = custReceipt;
            document.getElementById('kitchenReceiptText').innerText = kitchenReceipt;
            document.getElementById('receiptModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('receiptModal').classList.add('hidden');
            cart = [];
            document.getElementById('custName').value = '';
            updateCartUI();
        }
    </script>
</body>
</html>
